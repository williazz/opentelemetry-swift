<svg xmlns="http://www.w3.org/2000/svg" width="860" height="320" viewBox="0 0 860 320" role="img">
  <rect x="0" y="0" width="860" height="320" fill="#ffffff"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#1b1b1b">

    <!-- row labels -->
    <text x="112" y="56" text-anchor="end">Process</text>
    <text x="112" y="110" text-anchor="end"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">user.id</tspan></text>
    <text x="112" y="161" text-anchor="end">Spans</text>
    <text x="112" y="207" text-anchor="end">Log records</text>

    <!-- processes -->
    <rect x="120" y="40" width="230" height="24" fill="#dce9f7" stroke="#4a7fb5"/>
    <text x="235" y="56" text-anchor="middle">first launch</text>
    <rect x="366" y="40" width="214" height="24" fill="#dce9f7" stroke="#4a7fb5"/>
    <text x="473" y="56" text-anchor="middle">relaunch</text>
    <rect x="596" y="40" width="244" height="24" fill="#dce9f7" stroke="#4a7fb5"/>
    <text x="718" y="56" text-anchor="middle">later launch</text>

    <!-- user.id presence band -->
    <rect x="120" y="94" width="95" height="20" fill="#f4f4f4" stroke="#b5b5b5" stroke-dasharray="3 2"/>
    <rect x="215" y="94" width="135" height="20" fill="#cfe8d4" stroke="#4b9460"/>
    <rect x="366" y="94" width="214" height="20" fill="#cfe8d4" stroke="#4b9460"/>
    <text x="473" y="108" text-anchor="middle" font-size="11">restored from UserDefaults</text>
    <rect x="596" y="94" width="104" height="20" fill="#cfe8d4" stroke="#4b9460"/>
    <rect x="700" y="94" width="140" height="20" fill="#f4f4f4" stroke="#b5b5b5" stroke-dasharray="3 2"/>

    <!-- spans -->
    <rect x="134" y="148" width="52" height="18" fill="#ffffff" stroke="#8c8c8c"/>
    <rect x="196" y="148" width="72" height="18" fill="#ffffff" stroke="#8c8c8c"/>
    <rect x="278" y="148" width="58" height="18" fill="#cfe8d4" stroke="#4b9460"/>
    <rect x="380" y="148" width="60" height="18" fill="#cfe8d4" stroke="#4b9460"/>
    <rect x="460" y="148" width="80" height="18" fill="#cfe8d4" stroke="#4b9460"/>
    <rect x="610" y="148" width="60" height="18" fill="#cfe8d4" stroke="#4b9460"/>
    <rect x="716" y="148" width="74" height="18" fill="#ffffff" stroke="#8c8c8c"/>
    <text x="232" y="182" text-anchor="middle" font-size="11" fill="#555555">started before the call, so it carries no id</text>

    <!-- log records -->
    <rect x="156" y="196" width="9" height="16" fill="#ffffff" stroke="#8c8c8c"/>
    <rect x="300" y="196" width="9" height="16" fill="#cfe8d4" stroke="#4b9460"/>
    <rect x="400" y="196" width="9" height="16" fill="#cfe8d4" stroke="#4b9460"/>
    <rect x="520" y="196" width="9" height="16" fill="#cfe8d4" stroke="#4b9460"/>
    <rect x="640" y="196" width="9" height="16" fill="#cfe8d4" stroke="#4b9460"/>
    <rect x="762" y="196" width="9" height="16" fill="#ffffff" stroke="#8c8c8c"/>

    <!-- call marks -->
    <line x1="215" y1="36" x2="215" y2="240" stroke="#b03a2e" stroke-width="1.5" stroke-dasharray="4 3"/>
    <line x1="700" y1="36" x2="700" y2="240" stroke="#b03a2e" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="219" y="258" font-size="11" fill="#b03a2e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">setUserId("account-1234")</text>
    <text x="704" y="258" font-size="11" fill="#b03a2e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">clearUserId()</text>

    <!-- axis -->
    <line x1="120" y1="240" x2="846" y2="240" stroke="#1b1b1b"/>
    <path d="M846 240 l-7 -3.5 v7 z" fill="#1b1b1b"/>
    <text x="846" y="232" text-anchor="end" font-size="11" fill="#555555">time</text>

    <!-- legend -->
    <rect x="120" y="288" width="14" height="14" fill="#cfe8d4" stroke="#4b9460"/>
    <text x="140" y="300" font-size="11">carries user.id</text>
    <rect x="244" y="288" width="14" height="14" fill="#ffffff" stroke="#8c8c8c"/>
    <text x="264" y="300" font-size="11">no user.id attribute</text>
  </g>
</svg>
